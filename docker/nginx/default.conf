# Balanceador de carga: reparte las peticiones entre las réplicas del backend.
# Por defecto usa round-robin (una petición a cada réplica, por turnos).
upstream backends {
    # Memoria compartida entre los procesos de Nginx: sin esto, cada proceso lleva su propio turno
    # del round-robin y, con pocas peticiones, todas caen en la misma réplica.
    zone backends 64k;
    # ip_hash;   # ← descomentar para probar session affinity (cada IP va siempre a la misma réplica)
    server backend1:8000;
    server backend2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://backends;
        proxy_set_header Host $http_host;                               # conserva "localhost:8000"
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;    # IP real del cliente
    }
}
