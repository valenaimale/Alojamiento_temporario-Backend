# Demo de escalado horizontal: 2 réplicas del backend detrás de un balanceador, con las sesiones en Redis.
# MySQL NO corre acá: las réplicas usan el MySQL de la máquina (host.docker.internal).
# Uso: frenar "php -S" (usa el mismo puerto 8000) y ejecutar "docker compose up --build".
services:
  redis:
    image: redis:7-alpine

  backend1: &backend
    build: ./docker/php
    hostname: backend1
    volumes:
      - .:/app
    env_file: ./docker/backend.env       # DB_USER y DB_PASS (no se sube al repo)
    environment:
      SESIONES_DRIVER: redis
      REDIS_HOST: redis
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  backend2:
    <<: *backend
    hostname: backend2

  balanceador:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"                         # el frontend sigue apuntando a http://localhost:8000
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
