# Pipeline CI/CD del backend.
#
# Integración continua (CI): en cada push y en cada pull request hacia main, GitHub levanta una máquina
# limpia y verifica el backend:
#   lint → tests (unitarios + integración contra MySQL y Mailpit reales) → build de la imagen de producción
#
# Despliegue continuo (CD): solo en un push a main (o sea, al mergear un PR) y solo si todo lo anterior pasó:
#   deploy a Railway → verificación de producción (/estado responde con el commit nuevo)
# Si algo falla antes, el deploy ni se ejecuta y producción sigue con la versión anterior.
# El despliegue automático de Railway está apagado: la única forma de llegar a producción es este pipeline.
#
# Ver tests/README.md (cómo correr los tests localmente) y docs/despliegue.md (el pipeline completo).
name: CI/CD

on:
  push:
  pull_request:
    branches: [main]

# Si se sube otro commit a la misma rama mientras corre, se cancela la ejecución vieja.
# En main no se cancela: un despliegue a medias tiene que terminar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Lint y tests (PHPUnit)
    runs-on: ubuntu-latest

    # Servicios que necesitan los tests de integración: corren como contenedores al lado de la máquina del CI
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025   # SMTP: el backend manda los mails acá (los valores de config/configuracion.example.php)
          - 8025:8025   # API: los tests leen el mail de verificación

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'   # la misma versión que la imagen de producción (Dockerfile)
          extensions: pdo_mysql, curl, mbstring, openssl
          tools: composer:v2
          coverage: none

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (sintaxis de todos los archivos PHP)
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # Aiven (la base de producción) usa el modo SQL ANSI, más estricto que el de una instalación normal
      # (por ejemplo, las comillas dobles son nombres de columna, no textos). Los tests corren con el mismo
      # modo, así una consulta que fallaría en producción falla acá primero.
      - name: Configurar MySQL como Aiven (modo SQL ANSI)
        run: >-
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e
          "SET GLOBAL sql_mode = 'REAL_AS_FLOAT,PIPES_AS_CONCAT,ANSI_QUOTES,IGNORE_SPACE,ONLY_FULL_GROUP_BY,ANSI,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'"

      - name: Tests unitarios
        run: vendor/bin/phpunit --testsuite unitarios

      - name: Tests de integración
        run: vendor/bin/phpunit --testsuite integracion
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASS: root
          MAILPIT_URL: http://127.0.0.1:8025

  imagen:
    name: Build de la imagen de producción (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # La misma imagen que construye Railway: si el Dockerfile o las dependencias están rotos, falla acá
      - name: Construir la imagen
        run: docker build --tag alojamiento-backend .

      - name: Verificar que la imagen no tiene datos sensibles ni archivos de tests
        run: |
          docker run --rm alojamiento-backend sh -c '
            for archivo in phinx.php config/configuracion.php docker/backend.env tests phpunit.xml; do
              if [ -e "$archivo" ]; then echo "La imagen no debería tener $archivo"; exit 1; fi
            done
            echo "OK: la imagen no tiene archivos sensibles ni de tests"'

  desplegar:
    name: Deploy a Railway (producción)
    # solo cuando se actualiza main (un PR mergeado), nunca en otras ramas ni en los PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # solo si los tests y el build pasaron: si alguno falló, este job no se ejecuta
    needs: [tests, imagen]
    runs-on: ubuntu-latest
    # la herramienta oficial de Railway (CLI), ya instalada en esta imagen
    container: ghcr.io/railwayapp/cli:latest
    env:
      # token del proyecto en Railway, guardado como secreto del repo (Settings → Secrets and variables → Actions)
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # /estado muestra este commit: así la verificación de abajo sabe si producción ya tiene la versión nueva
      - name: Guardar el commit que se despliega
        run: echo "${{ github.sha }}" > version.txt

      # Sube el código; Railway construye la imagen con el Dockerfile y, antes de pasarle el tráfico,
      # comprueba que /estado responda 200 (Settings → Deploy → Healthcheck Path)
      - name: Desplegar en Railway
        run: railway up --service "Alojamiento_temporario-Backend" --ci

  verificar:
    name: Verificar producción (/estado)
    needs: [desplegar]
    runs-on: ubuntu-latest
    steps:
      # Espera (hasta 6 minutos) a que producción responda con el commit nuevo y la base funcionando
      - name: Esperar a que producción tenga la versión nueva
        env:
          URL_ESTADO: https://alojamientotemporario-backend-production.up.railway.app/estado
          VERSION: ${{ github.sha }}
        run: |
          esperada="${VERSION:0:7}"
          for intento in $(seq 1 36); do
            respuesta=$(curl -s --max-time 15 "$URL_ESTADO" || true)
            echo "Intento $intento: $respuesta"
            if echo "$respuesta" | grep -q "\"version\":\"$esperada\"" && echo "$respuesta" | grep -q '"estado":"ok"'; then
              echo "OK: producción tiene la versión $esperada y la base de datos responde"
              exit 0
            fi
            sleep 10
          done
          echo "Producción no respondió con la versión $esperada en 6 minutos"
          exit 1
